name: Temporary Douyin Live Background Browser Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "tmp/douyin-background-export/**"
      - ".github/workflows/tmp-douyin-background-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Parse Live Photo album through browser services
        run: python tmp/douyin-background-export/browser_probe.py

      - name: Show captured files
        if: always()
        run: find tmp/douyin-background-export/browser_probe_output -maxdepth 3 -type f -printf "%p %s bytes\n" | sort || true

      - name: Upload browser probe data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-live-browser-probe
          path: tmp/douyin-background-export/browser_probe_output/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
