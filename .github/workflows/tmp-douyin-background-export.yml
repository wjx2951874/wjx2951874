name: Temporary Douyin Live API Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "tmp/douyin-background-export/**"
      - ".github/workflows/tmp-douyin-background-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Call Live Photo parser API directly
        run: |
          set -euxo pipefail
          mkdir -p tmp/douyin-background-export/api_probe_output
          curl --fail-with-body --location --silent --show-error \
            --dump-header tmp/douyin-background-export/api_probe_output/headers.txt \
            --output tmp/douyin-background-export/api_probe_output/response.json \
            --get \
            --data-urlencode 'url=https://v.douyin.com/-K9Bpgl1daM/' \
            --header 'Accept: application/json, text/plain, */*' \
            --header 'Referer: https://parse.ideaflow.top/' \
            --header 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36' \
            'https://parse.ideaflow.top/video/share/url/parse'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tmp/douyin-background-export/api_probe_output/response.json')
          print('response bytes:', p.stat().st_size)
          data = json.loads(p.read_text(encoding='utf-8'))
          Path('tmp/douyin-background-export/api_probe_output/response.pretty.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('top-level:', type(data).__name__, list(data) if isinstance(data, dict) else len(data))
          print(json.dumps(data, ensure_ascii=False)[:5000])
          PY

      - name: Upload parser response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-live-api-response
          path: tmp/douyin-background-export/api_probe_output/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
