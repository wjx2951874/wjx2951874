name: Temporary Douyin Live Background Export

on:
  pull_request:
    branches:
      - main
    paths:
      - "tmp/douyin-background-export/**"
      - ".github/workflows/tmp-douyin-background-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-live-backgrounds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pillow requests gmssl

      - name: Fetch current Live Photo capable parser
        run: |
          mkdir -p tmp/douyin-background-export/vendor
          git clone --depth 1 https://github.com/DLWangSan/douyin_parse.git tmp/douyin-background-export/vendor/douyin_parse

      - name: Extract ordered live photos and build Android/GIF files
        run: python tmp/douyin-background-export/live_export.py

      - name: Show generated files
        run: find tmp/douyin-background-export/live_output -maxdepth 3 -type f -printf "%p %s bytes\n" | sort

      - name: Upload completed live-photo package
        uses: actions/upload-artifact@v4
        with:
          name: douyin-china-live-backgrounds-complete
          path: tmp/douyin-background-export/live_output/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
